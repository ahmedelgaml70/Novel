name: Frankenstein fast-path demo

on:
  push:
    branches: [main]
    paths:
      - 'production/rigged3d/frankenstein_fast.html'
      - 'production/rigged3d/src/frankenstein_fast.js'
      - 'production/rigged3d/tools/capture_demo.mjs'
      - '.github/workflows/frankenstein-fastpath-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-frankenstein-fastpath:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install renderer dependencies
        working-directory: production/rigged3d
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.55.0
          google-chrome --version

      - name: Vendor Three.js Draco decoder
        working-directory: production/rigged3d
        run: |
          mkdir -p public/draco
          cp node_modules/three/examples/jsm/libs/draco/* public/draco/
          ls -lh public/draco

      - name: Download V5.4.4 ready assets
        run: |
          set -eux
          mkdir -p production/rigged3d/public/assets/graveyard/Textures

          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/NafisRayan/Animate-Rigged-Humanoid-No-Blender/main/test/human_male.glb \
            -o production/rigged3d/public/assets/human_male.glb

          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/Kauaji/It-Guardian/224f38f970da01c8e978a313520ef3a9cad24b57/client/public/assets/inventory-map-3d/models/quaternius/table.glb \
            -o production/rigged3d/public/assets/table.glb

          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/evanly-gh/evanly.me/9fa3fdcf08165f0bb9130026dab94a2302a0b4bc/public/models/quaternius/Lever.glb \
            -o production/rigged3d/public/assets/lever.glb

          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/georg-doc/kayfabizarro/378b209355b13304e3cff656ec0806ca5b89df28/media/3D_Assets/GLB_graveyard/candle.glb \
            -o production/rigged3d/public/assets/graveyard/candle.glb

          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/georg-doc/kayfabizarro/378b209355b13304e3cff656ec0806ca5b89df28/media/3D_Assets/GLB_graveyard/Textures/colormap.png \
            -o production/rigged3d/public/assets/graveyard/Textures/colormap.png

          curl -L --fail --retry 3 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Lewis_William_lab.jpg' \
            -o production/rigged3d/public/assets/lab_background.jpg

          find production/rigged3d/public/assets -type f -maxdepth 4 -printf '%p %k KB\n' | sort
          sha256sum production/rigged3d/public/assets/human_male.glb

      - name: Start Vite
        working-directory: production/rigged3d
        run: |
          npx vite --host 127.0.0.1 --port 4173 > /tmp/frankenstein-vite.log 2>&1 &
          echo $! > /tmp/frankenstein-vite.pid
          for i in {1..45}; do
            curl -fsS http://127.0.0.1:4173/frankenstein_fast.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/frankenstein-vite.log
          exit 1

      - name: Capture 10-second canonical story proof
        working-directory: production/rigged3d
        env:
          DEMO_URL: http://127.0.0.1:4173/frankenstein_fast.html
          OUT_DIR: render-output-frankenstein
          DURATION: '8'
          FPS: '24'
          BROWSER_CHANNEL: chrome
        run: node tools/capture_demo.mjs

      - name: Install FFmpeg after capture
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Encode MP4 and review contact sheet
        working-directory: production/rigged3d
        run: |
          ffmpeg -y -framerate 24             -i render-output-frankenstein/frames/frame_%04d.png             -c:v libx264 -pix_fmt yuv420p -crf 18 -movflags +faststart             render-output-frankenstein/frankenstein_fast_v5_4_4.mp4

          ffmpeg -y -i render-output-frankenstein/frankenstein_fast_v5_4_4.mp4             -vf "fps=1,scale=320:-1,tile=5x2" -frames:v 1             render-output-frankenstein/contact_sheet.jpg

          ffprobe -v error             -show_entries format=duration,size             -show_entries stream=codec_name,width,height,r_frame_rate             -of json             render-output-frankenstein/frankenstein_fast_v5_4_4.mp4             > render-output-frankenstein/media_info.json

      - name: Upload Frankenstein fast-path proof
        uses: actions/upload-artifact@v4
        with:
          name: frankenstein-fast-v5-4-4
          path: |
            production/rigged3d/render-output-frankenstein/frankenstein_fast_v5_4_4.mp4
            production/rigged3d/render-output-frankenstein/contact_sheet.jpg
            production/rigged3d/render-output-frankenstein/clip_inventory.json
            production/rigged3d/render-output-frankenstein/media_info.json
          retention-days: 7

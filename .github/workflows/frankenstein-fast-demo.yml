name: Frankenstein fast-path demo

on:
  push:
    branches: [main]
    paths:
      - 'production/rigged3d/src/frankenstein_fast.js'
      - 'production/rigged3d/frankenstein_fast.html'
      - 'production/rigged3d/tools/capture_demo.mjs'
      - '.github/workflows/frankenstein-fast-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install app dependencies
        working-directory: production/rigged3d
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Download pinned ready assets
        run: |
          set -eux
          mkdir -p production/rigged3d/public/assets/graveyard/Textures

          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/NafisRayan/Animate-Rigged-Humanoid-No-Blender/5821923af517ac5fdc82505faa92a0d575fc1b1a/test/human_male.glb \
            -o production/rigged3d/public/assets/human_male.glb

          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/georg-doc/kayfabizarro/2215b8895588b1dcf787cd55c08fe76371895f59/media/3D_Assets/quaternius_cc0-table-1411.glb \
            -o production/rigged3d/public/assets/table.glb

          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/evanly-gh/evanly.me/9fa3fdcf08165f0bb9130026dab94a2302a0b4bc/public/models/quaternius/Lever.glb \
            -o production/rigged3d/public/assets/lever.glb

          for file in brick-wall.glb altar-stone.glb candle.glb; do
            curl -L --fail --retry 3 \
              "https://raw.githubusercontent.com/georg-doc/kayfabizarro/2215b8895588b1dcf787cd55c08fe76371895f59/media/3D_Assets/GLB_graveyard/$file" \
              -o "production/rigged3d/public/assets/graveyard/$file"
          done

          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/georg-doc/kayfabizarro/2215b8895588b1dcf787cd55c08fe76371895f59/media/3D_Assets/GLB_graveyard/Textures/colormap.png \
            -o production/rigged3d/public/assets/graveyard/Textures/colormap.png

          sha256sum production/rigged3d/public/assets/human_male.glb \
                    production/rigged3d/public/assets/table.glb \
                    production/rigged3d/public/assets/lever.glb \
                    production/rigged3d/public/assets/graveyard/*.glb

      - name: Start Vite
        working-directory: production/rigged3d
        run: |
          npx vite --host 127.0.0.1 --port 4173 > /tmp/frankenstein-vite.log 2>&1 &
          echo $! > /tmp/frankenstein-vite.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/frankenstein_fast.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/frankenstein-vite.log
          exit 1

      - name: Capture 10-second story-specific proof
        working-directory: production/rigged3d
        env:
          DEMO_URL: http://127.0.0.1:4173/frankenstein_fast.html
          OUT_DIR: frankenstein-output
          FPS: 24
          DURATION: 10
        run: node tools/capture_demo.mjs

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Encode MP4 and contact sheet
        working-directory: production/rigged3d
        run: |
          ffmpeg -y -framerate 24 -i frankenstein-output/frames/frame_%04d.png \
            -c:v libx264 -pix_fmt yuv420p -crf 18 -movflags +faststart \
            frankenstein-output/frankenstein_fast_path_v5_4_2.mp4

          ffmpeg -y -i frankenstein-output/frankenstein_fast_path_v5_4_2.mp4 \
            -vf "fps=1,scale=320:-1,tile=5x2" -frames:v 1 \
            frankenstein-output/contact_sheet.jpg

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: frankenstein-fast-path-v5-4-2
          path: |
            production/rigged3d/frankenstein-output/frankenstein_fast_path_v5_4_2.mp4
            production/rigged3d/frankenstein-output/contact_sheet.jpg
            production/rigged3d/frankenstein-output/clip_inventory.json
          retention-days: 7
